<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Producer Theory Lab</title>
<meta name="description" content="A 22-lesson interactive music theory course for producers — a playable 3D keyboard, step grid, circle of fifths and piano roll, with live audio.">
<meta name="theme-color" content="#0E9465">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<div class="app">
  <aside class="rail" id="rail">
    <div class="brand">
      <svg class="bow" viewBox="0 0 32 32" aria-hidden="true">
        <path class="a" d="M15 16 3 8c-1.4-.9-2.6.3-2.3 1.9l1.3 6.1-1.3 6.1C.4 23.7 1.6 24.9 3 24z"/>
        <path class="b" d="M17 16 29 8c1.4-.9 2.6.3 2.3 1.9L30 16l1.3 6.1c.3 1.6-.9 2.8-2.3 1.9z"/>
        <circle class="c" cx="16" cy="16" r="3.4"/>
      </svg>
      <div>
        <h1>Producer Theory Lab</h1>
        <p>26 lessons in 8 stages · sound on</p>
      </div>
    </div>
    <div class="prog">
      <div class="prog-row"><span>Lessons</span><span class="mono" id="progTxt">0 / 26</span></div>
      <div class="prog-bar"><i id="progBar"></i></div>
      <div class="prog-row" style="margin-top:11px"><span>Drills</span><span class="mono" id="drillTxt">not started</span></div>
      <div class="prog-bar"><i id="drillBar"></i></div>
      <button class="b review-btn" id="reviewBtn" type="button" hidden></button>
      <div class="synced" id="synced" hidden></div>
    </div>
    <nav class="nav" id="nav" aria-label="Lessons"></nav>
    <div class="rail-foot">
      <button class="b reset-btn" id="resetBtn" type="button"></button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main">
    <section class="stage" id="stage">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div class="flat" id="flat" hidden></div>
      <div class="hud">
        <span class="tag" id="hudTag">Rhythm</span>
        <div class="readout mono" id="readout" role="status" aria-live="polite">ready</div>
      </div>
      <div class="stage-foot">
        <button class="b menu-btn" id="menuBtn" aria-expanded="false">☰ Lessons</button>
        <div class="ctl" id="stageCtl"></div>
        <button class="b flat-btn" id="flatBtn" type="button" aria-pressed="false">Flat view</button>
        <button class="b set-btn" id="setBtn" type="button" aria-expanded="false"
                aria-haspopup="true" title="Reading level and theme">Aa</button>
        <div class="setpop" id="setPop" role="dialog" aria-label="Display settings" hidden></div>
        <span class="hint" id="stageHint"></span>
      </div>
    </section>
    <details class="a11y" id="a11y">
      <summary id="a11ySum">Instrument controls</summary>
      <div id="a11yBody"></div>
    </details>
    <article class="console" id="console"></article>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>if(!window.THREE){document.write('<scr'+'ipt src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/scr'+'ipt>')}</script>
<script src="src/sync.js"></script>
<script src="src/theory.js"></script>
<script src="src/scenes.js"></script>
<script src="src/mastery.js"></script>
<script src="src/ui.js"></script>
<script src="src/practice.js"></script>
<script src="src/studio.js"></script>
<script src="src/flat.js"></script>
<script src="src/lessons-level1.js"></script>
<script src="src/lessons-level2.js"></script>
<script src="src/lessons-level3.js"></script>
<script src="src/simple-level1.js"></script>
<script src="src/simple-level2.js"></script>
<script src="src/lessons-production.js"></script>
<script src="src/simple-production.js"></script>
<script src="src/curriculum.js"></script>
<script>
/* the local server, when there is one, hydrates before the app reads storage */
if (typeof SYNC !== "undefined") SYNC.start(function () { APP.boot(); }); else APP.boot();
</script>

</body>
</html>
